[project]
name = "neurogarden"
version = "0.1.0"
description = "Small worlds. Strange minds. A life simulator for small brains."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "gymnasium>=1.0",
    "websockets>=14",
    "pydantic>=2.7",
]

[project.scripts]
neurogarden = "neurogarden.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurogarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: balance guard, benchmark and the web bundle rebuild (tens of seconds)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
